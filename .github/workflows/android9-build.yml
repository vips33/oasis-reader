
name: Android 9 ARMv7 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set Android 9 minimum SDK
        run: |
          sed -i \
            's/minSdk = 29/minSdk = 28/' \
            app/build.gradle.kts

          grep 'minSdk = ' app/build.gradle.kts

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Inspect APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep '\.so$' || true
          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" | grep -E \
            "package:|sdkVersion:|native-code:" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OasisReader-Android9-ARMv7
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
